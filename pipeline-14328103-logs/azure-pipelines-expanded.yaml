          echo "##vso[task.setvariable variable=AWS_SESSION_TOKEN]"
- stage: stage_device_pod21
  displayName: stage_device_pod21 - Terragrunt Live Infrastructure
  dependsOn:
  - PreSplunkReporting
  variables:
  - name: pool
    value: 'codeway-aws-linux2023'
  - name: ephemeralAgent
    value: true
  - group: tf-pipeline-wppgen2-prod
  - name: externalId
    value: $[variables['external_id']]
  - name: roleArn
    value: $[variables['role_arn']]
  pool:
    name: codeway-aws-linux2023
  jobs:
  - job: filter
    displayName: Stage Filter
    pool:
      name: codeway-aws-linux2023-tiny
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: true
        fetchDepth: 0
    - task: CmdLine@2
      name: GetChangedFilesFilterStages
      displayName: GetChangedFiles FilterStages
      inputs:
        script: >
          if [ -n "$CHANGED_FILES" ]; then
            echo "Changed files set."
          else
            echo "No changedFiles set. Use latest commit."
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -m --diff-filter=ACRM -r 164fc48798ee3c3b43ac7ebf071bf27d9320899e | tr '\n' '|')
          fi

          echo "Changed files: $CHANGED_FILES"

          echo "##vso[task.setvariable variable=changedFiles;isOutput=true]$CHANGED_FILES"
    - task: CmdLine@2
      name: Filter
      inputs:
        script: >
          echo "Filter: True"


          if [ -n "" ]; then
            echo "DestroyDirs declared. Dirs: "
            echo "##vso[task.setvariable variable=runStage;isOutput=true]true"
          elif [ "True" = "True" ]; then
            echo "Identifying code changes for stage filtering..."
            root_dir=$(Build.Repository.LocalPath)
            root_boundary=$(readlink -f "$root_dir"/..)
            path="$root_dir/infra/wppgen2-prod/eu-central-1/stage/service-infra-for-pods/device-pod21/wppgen2/vp-device/"
            acceptable_changes="/tmp/$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 24 | head -n 1).txt"

            echo "##vso[task.setvariable variable=runStage;isOutput=true]false"

            find "$path" -type f >> $acceptable_changes
            while [[ $path != "$root_boundary" ]];
            do
              find "$path" -maxdepth 1 -mindepth 1 -name "*.hcl" >> $acceptable_changes
              path="$(readlink -f "$path"/..)"
            done
            for additional_path in ; do
              additional_full_path="$root_dir/$additional_path"
              find "$additional_full_path" -type f >> $acceptable_changes
            done
            CHANGED_FILES="$(GetChangedFilesFilterStages.changedFiles)"
            echo "Changed files: $CHANGED_FILES"
            IFS='|' read -ra FILES <<< "$CHANGED_FILES"
            for line in "${FILES[@]}";
            do
              if grep -q "$root_dir/$line" "$acceptable_changes"; then
                echo "Identified change in $root_dir/$line"
                echo "##vso[task.setvariable variable=runStage;isOutput=true]true"
              fi
            done
          else
            echo "Skip stage filtering..."
            echo "##vso[task.setvariable variable=runStage;isOutput=true]true"
          fi
  - job: stage_device_pod21
    displayName: 'Terragrunt Deployment - Path: infra/wppgen2-prod/eu-central-1/stage/service-infra-for-pods/device-pod21/wppgen2/vp-device/'
    dependsOn:
    - filter
    timeoutInMinutes: 60
    condition: eq(dependencies.filter.outputs['Filter.runStage'], 'true')
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
    - task: UsePythonVersion@0
      condition: succeeded()
      inputs:
        versionSpec: 3
        addToPath: true
        architecture: 'x64'
    - task: Bash@3
      displayName: Install terragrunt
      inputs:
        targetType: inline
        script: >
          URL=https://github.com/gruntwork-io/terragrunt/releases/download/v0.32.3/terragrunt_linux_amd64

          DIR=$(Agent.ToolsDirectory)/terragrunt/v0.32.3

          FILE=$DIR/terragrunt


          if [ ! -f "$FILE" ]; then
            mkdir -p $DIR
            echo "Downloading terragrunt version v0.32.3..."
            if [ $(curl -Lf -w '%{http_code}' "$URL" -o "$FILE") -ne 200 ]; then
              echo "##vso[task.logissue type=error;]Error downloading terragrunt version v0.32.3"
              echo "##vso[task.complete result=Failed;]"
              exit 1
            fi
            chmod +x $FILE
          else
            echo "Skipping download as terragrunt is already installed in $FILE"
          fi


          # Add to path var

          echo "##vso[task.prependpath]$DIR"
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 1.0.7
      displayName: Install Terraform
    - task: Bash@3
      displayName: Install aws-iam-authenticator (Linux)
      condition: and(always(), eq(variables['Agent.OS'], 'Linux'))
      inputs:
        targetType: inline
        script: >
          DIR=$(Agent.ToolsDirectory)/aws-iam-authenticator/1.14.6

          FILE=$DIR/aws-iam-authenticator


          if [ ! -f "$FILE" ]; then
            mkdir -p $DIR
            echo "##[debug]Downloading aws-iam-authenticator version 1.14.6..."
            curl -Lf 'https://amazon-eks.s3-us-west-2.amazonaws.com/1.14.6/2019-08-22/bin/linux/amd64/aws-iam-authenticator' -o $FILE && \
            chmod +x $FILE
          else
            echo "##[command]Skipping download as aws-iam-authenticator is already installed in $FILE"
          fi


          # Add bin to path

          echo "##vso[task.prependpath]$DIR"
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: >
          $binFolder = "$(Agent.ToolsDirectory)\aws-iam-authenticator\1.14.6"

          $file      = "$binFolder\aws-iam-authenticator.exe"

          $wc        = New-Object System.Net.WebClient


          New-Item -ItemType Directory -Path $binFolder -Force | Out-Null


          if (-not (Test-Path -Path $file)) {
            $downloadUri = "https://amazon-eks.s3-us-west-2.amazonaws.com/1.14.6/2019-08-22/bin/windows/amd64/aws-iam-authenticator.exe"
            Write-Host "##[debug]Downloading aws-iam-authenticator.exe from $downloadUri..."
            $wc.DownloadFile($downloadUri, $file)
          } else {
            Write-Host "##[command]AWS IAM Authenticator found, skipping download."
          }


          # Add bin to path

          Write-Host "##vso[task.prependpath]$binFolder"
      displayName: Install aws-iam-authenticator (Windows)
      condition: and(always(), eq(variables['Agent.OS'], 'Windows_NT'))
    - task: Bash@3
      displayName: Validate aws-iam-authenticator installation
      inputs:
        targetType: inline
        script: aws-iam-authenticator version
    - task: CmdLine@2
      displayName: 'Authenticate on GCP'
      inputs:
        script: >
          if [ ! -z "" ]

