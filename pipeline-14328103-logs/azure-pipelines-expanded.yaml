          eval ${sts_cmd[*]} > assumed-role.json


          KEY_ID="$(awk -F'"' '/AccessKeyId/ {print $4}' assumed-role.json)"

          ACCESS_KEY="$(awk -F'"' '/SecretAccessKey/ {print $4}' assumed-role.json)"

          SESSION_TOKEN="$(awk -F'"' '/SessionToken/ {print $4}' assumed-role.json)"


          rm assumed-role.json


