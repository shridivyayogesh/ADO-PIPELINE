          echo "Running terragrunt run-all plan command on infra/wppgen2-prod/us-west-2/prod/service-infra-for-pods/device-pod1/wppgen2/vp-device/"

          rootPath="$(Build.Repository.LocalPath)/infra/wppgen2-prod/us-west-2/prod/service-infra-for-pods/device-pod1/wppgen2/vp-device/"


          terragruntIncludeArgs=""

          if [ False = True ]

