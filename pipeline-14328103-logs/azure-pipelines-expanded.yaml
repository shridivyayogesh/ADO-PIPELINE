    - task: Bash@3
      displayName: "Update git config settings"
      env:
        GHE_USER: $(gheUser)
        GHE_TOKEN: $(ghePassword)
        GHE_HOSTNAME: github.azc.ext.hp.com
        GH_USER: ''
        GH_TOKEN: ''
        HOME: $(Agent.TempDirectory)
      inputs:
        targetType: inline
        script: |
          echo "Configuring GitHub Enterprise access"

          git config --global url."https://$GHE_HOSTNAME/".insteadOf "git@$GHE_HOSTNAME:"
          git config --global url."https://$GHE_HOSTNAME/".insteadOf "ssh://git@$GHE_HOSTNAME/"
          echo "https://$GHE_USER:$GHE_TOKEN@$GHE_HOSTNAME" >> $HOME/.git-credentials

          if [ -n "$GH_USER" ] && [ -n "$GH_TOKEN" ]; then
            echo "Configuring public GitHub access"
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
            echo "https://$GH_USER:$GH_TOKEN@github.com" >> $HOME/.git-credentials
          fi


          git config --global url."https://".insteadOf git://
          git config --global credential.helper store
    - task: Bash@3
      displayName: Assume the role in team’s AWS account
      condition: succeeded()
      inputs:
        targetType: inline
        script: >
          unset AWS_SECRET_ACCESS_KEY

          unset AWS_SESSION_TOKEN

          unset AWS_ACCESS_KEY_ID


          if [ "" = "" ]; then
            SESSION_NAME="$(Agent.Name)-$(Agent.Id)-$(Build.BuildId)"
          else
            SESSION_NAME=""
          fi


          sts_cmd=('aws sts assume-role'
                    '--role-arn="$(roleArn)"'
                    '--role-session-name="$SESSION_NAME"'
                    '--external-id="$(externalId)"'
                    '--duration-seconds="3600"')

          eval ${sts_cmd[*]} > assumed-role.json


          KEY_ID="$(awk -F'"' '/AccessKeyId/ {print $4}' assumed-role.json)"

          ACCESS_KEY="$(awk -F'"' '/SecretAccessKey/ {print $4}' assumed-role.json)"

          SESSION_TOKEN="$(awk -F'"' '/SessionToken/ {print $4}' assumed-role.json)"


          rm assumed-role.json


          if [ -n "$KEY_ID" ] && [ -n "$ACCESS_KEY" ] && [ -n "$SESSION_TOKEN" ]

          then
            echo "##[section]Successfully assumed role: $(roleArn)"

            echo "##vso[task.setvariable variable=AWS_ACCESS_KEY_ID]$KEY_ID"
            echo "##vso[task.setvariable variable=AWS_SECRET_ACCESS_KEY]$ACCESS_KEY"
            echo "##vso[task.setvariable variable=AWS_SESSION_TOKEN]$SESSION_TOKEN"
          else
            echo "##vso[task.logissue type=error;]Error: could not assume role: $(roleArn)"
            exit 1
          fi
    - task: PythonScript@0
      displayName: Check Module Versions
      name: CheckModuleVersions
      condition: |
        and(
          succeeded(),
          or(
            contains(variables['Build.Repository.Name'], 'onecloud-'),
            contains(variables['Build.Repository.Name'], 'hpip-'),
            contains(variables['Build.Repository.Name'], 'tropos-')
          )
        )
      inputs:
        scriptSource: 'inline'
        workingDirectory: infra/wppgen2-prod/us-east-1/prod/service-infra-for-pods/device-pod8/wppgen2/vp-device/
        script: |
          import os
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          def resolve_variable_from_file(terragrunt_file):
              """
              Resolve Terragrunt variable expressions like:
              ${read_terragrunt_config(find_in_parent_folders("commons.hcl")).locals.irsa_module_version}
              """
              try:
                  with open(terragrunt_file, 'r') as f:
                      content = f.read()

                  # If no Terragrunt expressions, just extract literal ref
                  if 'read_terragrunt_config' not in content and 'find_in_parent_folders' not in content:
                      literal_match = re.search(r'\?ref=([^&\s"]+)', content)
                      return literal_match.group(1) if literal_match else None

                  # Extract filename and variable name from the expression
                  combined_match = re.search(
                      r'source\s*=\s*"[^"]*\?ref=\$\{read_terragrunt_config\(find_in_parent_folders\(\s*["\']([^"\']+)["\']\s*\)\)\.(locals\.)?([a-zA-Z_][a-zA-Z0-9_]*)',
                      content, re.DOTALL)

                  if not combined_match:
                      return None

                  referenced_file = combined_match.group(1)
                  var_name = combined_match.group(3)

                  # Walk up parent directories to find the referenced file
                  current_dir = Path(terragrunt_file).resolve().parent
                  found_file = None

                  while True:
                      check_path = current_dir / referenced_file
                      if check_path.exists():
                          found_file = check_path
                          break
                      if current_dir == current_dir.parent:
                          break
                      current_dir = current_dir.parent

                  if not found_file:
                      return None

                  # Extract variable value from the HCL file
                  with open(found_file, 'r') as f:
                      hcl_content = f.read()

                  var_match = re.search(rf'\b{re.escape(var_name)}\s*=\s*["\']([^"\']+)["\']', hcl_content)
                  return var_match.group(1) if var_match else None
              except:
                  return None

          def extract_source(filepath):
              """Extract terraform source URL from a terragrunt.hcl file."""
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                  match = re.search(r'terraform\s*\{\s*source\s*=\s*"([^"]+)"', content, re.DOTALL)
                  return match.group(1) if match else None
              except:
                  return None

          def parse_source_url(source, filepath=None):
              """
              Parse a Terraform source URL to extract repo info.
              Returns: (source_type, repo, hostname, version, git_url)

              Handles:
                git::https://host/owner/repo.git//subdir?ref=version
                git::ssh://git@host/owner/repo//subdir?ref=version
                github.com/owner/repo?ref=version
              """
              if not source:
                  return None, None, None, None, None

              # Skip Terraform Registry sources
              if source.startswith('tfr://'):
                  return None, None, None, None, None

              base_url = source
              if base_url.startswith('git::'):
                  base_url = base_url[5:]

              # Remove module subdirectory (// separator) - careful not to strip protocol://
              if base_url.startswith('ssh://'):
                  subdir_pos = base_url.find('//', 6)
                  if subdir_pos > 0:
                      base_url = base_url[:subdir_pos]
              elif base_url.startswith('https://'):
                  subdir_pos = base_url.find('//', 8)
                  if subdir_pos > 0:
                      base_url = base_url[:subdir_pos]
              elif '//' in base_url:
                  base_url = base_url.split('//')[0]

              # Strip query parameters from base URL
              if '?' in base_url:
                  base_url = base_url.split('?')[0]
              if not base_url.endswith('.git'):
                  base_url += '.git'

              # Extract hostname
              hostname_match = re.search(r'(?:https://|ssh://git@)?([^/:]+)', base_url)
              if not hostname_match:
                  return None, None, None, None, None
              hostname = hostname_match.group(1)

              # Extract owner/repo
              repo_match = re.search(r'(?:https://|ssh://git@)?[^/]+/([^/]+)/([^/]+?)(?:\.git)?$', base_url)
              if not repo_match:
                  return None, None, None, None, None
              owner, repo = repo_match.group(1), repo_match.group(2)

              # Extract version from ?ref= parameter
              ref_match = re.search(r'\?ref=(.+?)(?:&|$)', source, re.DOTALL)
              ref = ref_match.group(1).strip() if ref_match else None

              # Resolve Terragrunt variable expressions in ref
              if ref and ('read_terragrunt_config' in ref or '${' in ref):
                  if filepath:
                      resolved = resolve_variable_from_file(filepath)
                      if resolved:
                          ref = resolved
                      else:
                          return None, None, None, None, None
                  else:
                      return None, None, None, None, None

              return 'git', f"{owner}/{repo}", hostname, ref, base_url

          def is_version_tag(ref):
              """Check if a ref looks like a version tag (v1.2.3) vs a branch name (main, feature/x)."""
              if not ref:
                  return False
              return bool(re.match(r'^v?\d+\.\d+', ref))

          def get_latest_tag(git_url):
              """Get the latest version tag from a git repository using git ls-remote."""
              try:
                  result = subprocess.run(
                      ['git', 'ls-remote', '--tags', '--refs', '--sort=-v:refname', git_url],
                      capture_output=True, text=True, timeout=15)
                  if result.returncode == 0 and result.stdout.strip():
                      first_line = result.stdout.strip().split('\n')[0]
                      if '\trefs/tags/' in first_line:
                          return first_line.split('\trefs/tags/', 1)[1]
                  return None
              except:
                  return None

          def compare_versions(current, latest):
              """Return True if current is older than latest (semver comparison)."""
              if not current or not latest:
                  return False
              c = current.lstrip('v')
              l = latest.lstrip('v')
              if c == l:
                  return False
              try:
                  return [int(x) for x in c.split('.')] < [int(x) for x in l.split('.')]
              except:
                  return c < l

          # Accounts that are subject to the version-gate enforcement.
          # If a repo's account.hcl provisioning_role_arn matches one of these,
          # outdated modules will FAIL the pipeline rather than just warn.
          GATED_ACCOUNTS = {
              '063275741980', '789619356883', '494584079473', '263851501904',
              '369718303544', '424734422056', '265549514635', '694970373684',
              '996100741145', '354230251873', '443813933915', '413963233857',
              '066093625311', '344493772327', '314135228934', '506433222145',
              '746102084713', '625990911231', '254270793948', '465292260968',
              '838780231870', '436924188143', '420981643022', '611818464642',
              '727337432220', '891377241932', '905418066599', '371878160178',
              '197920284899', '257136501311', '851510747272', '302001397007',
              '024875494675', '155386467867', '103693269857', '704986368101',
              '254675571580', '950061775163', '797666781345', '052941645011',
              '813565873106', '159822161024', '024258572711', '237617080909',
              '182264891876', '802893213975',
              '053928384481', '931077910904', '411205170163', '447478841092',
              '958693614816', '126350429920', '064682958169',
          }

          def get_repo_accounts():
              """Determine the AWS account this pipeline is targeting.

              Uses 'aws sts get-caller-identity' as the primary and reliable method.
              By the time this step runs, aws-assume-role-v0.yaml has already assumed
              the target account's provisioning role — so the current AWS identity IS
              the target account, regardless of how account.hcl expresses it:
                - get_aws_account_id()
                - format("arn:aws:iam::%s:role/...", local.account_number)
                - "arn:aws:iam::${local.account_number}:role/..."
                - hardcoded: "arn:aws:iam::063275741980:role/..."

              Fallback: if STS is unavailable, scan account.hcl for any literal
              12-digit number (AWS account IDs are always exactly 12 digits).
              """
              accounts = set()

              # Primary: current AWS identity = target account (works for ALL HCL styles)
              try:
                  r = subprocess.run(
                      ['aws', 'sts', 'get-caller-identity', '--query', 'Account', '--output', 'text'],
                      capture_output=True, text=True, timeout=15)
                  if r.returncode == 0 and r.stdout.strip():
                      account = r.stdout.strip()
                      print(f"Current AWS account resolved via STS")
                      accounts.add(account)
                      return accounts
              except Exception as e:
                  print(f"AWS STS lookup failed ({e}) - falling back to account.hcl parsing...")

              # Fallback: scan account.hcl files for any literal 12-digit account number
              try:
                  result = subprocess.run(['find', '.', '-name', 'account.hcl', '-type', 'f'],
                                        capture_output=True, text=True)
                  if result.returncode == 0 and result.stdout.strip():
                      for filepath in result.stdout.strip().split('\n'):
                          filepath = filepath.strip()
                          if not filepath:
                              continue
                          try:
                              with open(filepath, 'r') as f:
                                  content = f.read()
                              for m in re.finditer(r'\b(\d{12})\b', content):
                                  accounts.add(m.group(1))
                          except:
                              pass
              except:
                  pass

              if accounts:
                  print(f"Account(s) found via account.hcl fallback")
              else:
                  print("Could not determine target AWS account - gate check will be skipped.")

              return accounts

          # --- Main ---
          print("Scanning for Terraform module sources in terragrunt.hcl files...")
          scan_dir = os.getcwd()
          print(f"Scanned directory: {scan_dir}")
          print()

          # Find all terragrunt.hcl files
          result = subprocess.run(['find', '.', '-name', 'terragrunt.hcl', '-type', 'f'],
                                capture_output=True, text=True, check=True)
          files = [f.strip() for f in result.stdout.strip().split('\n') if f.strip()]
          print(f"Found {len(files)} terragrunt.hcl file(s)")

          # Parse sources from all files
          sources = defaultdict(list)
          for filepath in files:
              source = extract_source(filepath)
              if source:
                  source_type, repo, hostname, version, git_url = parse_source_url(source, filepath)
                  if source_type == 'git' and repo:
                      sources[(source_type, repo, hostname, version, git_url)].append(filepath)

          print(f"Found {len(sources)} unique git module source(s)")
          print()

          # Check each module for updates
          outdated = []
          for (source_type, repo, hostname, current_version, git_url), filepaths in sources.items():
              print(f"Checking {repo} on {hostname} (current: {current_version or 'unpinned'})...")
              latest = get_latest_tag(git_url)
              if not latest:
                  print(f"  Could not determine latest version - skipping")
                  continue

              if not current_version:
                  print(f"  UNPINNED - latest available: {latest}")
                  outdated.append({'repo': repo, 'hostname': hostname,
                                   'current': 'unpinned (default branch)', 'latest': latest, 'files': filepaths})
              elif not is_version_tag(current_version):
                  print(f"  Using branch '{current_version}' - latest tag: {latest}")
                  outdated.append({'repo': repo, 'hostname': hostname,
                                   'current': f'branch: {current_version}', 'latest': latest, 'files': filepaths})
              elif compare_versions(current_version, latest):
                  print(f"  OUTDATED: {current_version} -> {latest}")
                  outdated.append({'repo': repo, 'hostname': hostname,
                                   'current': current_version, 'latest': latest, 'files': filepaths})
              else:
                  print(f"  Up to date ({current_version})")

          print()
          print(f"Found {len(outdated)} module(s) with version issues")

          # Generate markdown report
          lines = []
          if outdated:
              lines.append('## Terraform Module Version Issues')
              lines.append(f'Scanned directory: `{scan_dir}`')
              lines.append('')
              lines.append(f'Found **{len(outdated)}** module(s) with version issues:')
              lines.append('')
              lines.append('> **Warning:** Unpinned modules point to default branch (main/master) and should be pinned to specific versions for stability.')
              lines.append('')

              modules_by_host = defaultdict(list)
              for m in outdated:
                  modules_by_host[m['hostname']].append(m)

              for host in sorted(modules_by_host.keys()):
                  lines.append(f'### {host}')
                  lines.append('')
                  for m in modules_by_host[host]:
                      lines.append(f'**{m["repo"]}**')
                      lines.append(f'- Current: `{m["current"]}`')
                      lines.append(f'- Latest: `{m["latest"]}`')
                      lines.append(f'- Used in: {len(m["files"])} file(s)')
                      display_files = m['files'][:5]
                      for f in display_files:
                          lines.append(f'  - `{f}`')
                      if len(m['files']) > 5:
                          lines.append(f'  - ... and {len(m["files"]) - 5} more file(s)')
                      lines.append('')

              lines.append('---')
              lines.append('Consider updating modules to get latest features and security fixes.')
              print(f"##vso[task.logissue type=warning]ACTION REQUIRED: {len(outdated)} module(s) in this path are outdated. Update the ?ref= tags in your terragrunt.hcl files — see the PR comment for details.")
          else:
              lines.append('## Terraform Module Version Check')
              lines.append('')
              lines.append('All modules are up to date!')

          report = '\n'.join(lines)
          report_file = os.path.join(scan_dir, 'tgversioncheck.txt')
          with open(report_file, 'w') as f:
              f.write(report + '\n')
          print(f"Report written to: {report_file}")

          print(f"##vso[task.setvariable variable=hasOutdated;isOutput=true]{'true' if outdated else 'false'}")
          print(f"##vso[task.setvariable variable=outdatedCount;isOutput=true]{len(outdated)}")

          # Gate enforcement is currently in warning-only mode.
          # Account matching is logged for observability; pipeline will not be blocked.
          if outdated:
              repo_accounts = get_repo_accounts()
              gated_matches = repo_accounts & GATED_ACCOUNTS
              if gated_matches:
                  print(f"##vso[task.logissue type=warning]ACTION REQUIRED: {len(outdated)} module(s) in this path are outdated and subject to version gate enforcement. Update the ?ref= tags now — once enforcement is activated, outdated modules will block deployments.")
      env:
        HOME: $(Agent.TempDirectory)
