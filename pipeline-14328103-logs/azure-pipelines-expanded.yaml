    - task: PythonScript@0
      inputs:
        scriptSource: 'inline'
        script: >
          import json

          import re


          terragrunt_out_file = 'terragrunt.out'

          collapse_pr_message = False


          o = open(terragrunt_out_file)

          message = []


          retrieve_changes = False


          # Remove ANSI escape controls (normally used for color)

          ansi_escape = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')


          # Matches Terragrunt v0.50+ module path prefix: e.g. "[path/to/module] "

          tg_prefix = re.compile(r'^\[[\w/.\-]+\]\s')


          for line in o:

            line = line.rstrip('\n')
            line = ansi_escape.sub('', line)

            # Strip Terragrunt v0.50+ module path prefix before matching markers
            line_stripped = line.strip()
            line_stripped_no_prefix = tg_prefix.sub('', line_stripped)

            if line_stripped_no_prefix.startswith("Terraform will perform the following actions"):
              retrieve_changes = True
            elif line_stripped_no_prefix.startswith("Plan: ") or line_stripped_no_prefix.startswith("Note: "):
              retrieve_changes = False
            elif retrieve_changes:
              # Strip module prefix from content lines for clean output
              line = tg_prefix.sub('', line)
              line_stripped = line.strip()
              if re.search(r'unchanged (attribute|attributes|block|blocks|element|elements) hidden', line_stripped) is not None:
                line = "" # ignore
              if len(line) > 0:
                message.append(line)

          if len(message) > 0:
            message.insert(0, "```hcl")

            if collapse_pr_message:
              message.insert(0,"\n<details><summary>Change details</summary>\n")

            message.insert(0, "## *infra/wppgen2-prod/us-east-1/prod/service-infra-for-pods/device-pod4/wppgen2/vp-device/*: Changes found")
            message.append("```")

            if collapse_pr_message:
              message.append("\n</details>")

          else:
            message.append("## *infra/wppgen2-prod/us-east-1/prod/service-infra-for-pods/device-pod4/wppgen2/vp-device/*: No changes were found")

          p = open("tgplan.txt", "w")

          for line in message:
            p.write("%s\n" % line)
          p.close()
      displayName: Run Terragrunt change detector
