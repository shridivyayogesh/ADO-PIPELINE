    - task: PythonScript@0
      displayName: "Comment on Pull Request"
      condition: >
        and(
          succeeded(),
          or(
            contains(variables['Build.Repository.Name'], 'onecloud-'),
            contains(variables['Build.Repository.Name'], 'hpip-'),
            contains(variables['Build.Repository.Name'], 'tropos-')
          )
        )
      inputs:
        failOnStderr: false
        pythonInterpreter: 'python'
        scriptSource: 'inline'
        script: >
          import json

          import re

          from http.client import HTTPSConnection

          from urllib.parse import urlparse


          repoUri = '$(System.PullRequest.SourceRepositoryUri)'

          repo = '$(Build.Repository.Name)'

          prNumber = '$(System.PullRequest.PullRequestNumber)'


          prMatch = re.findall(r'refs/pull/(\d+)/merge', '$(Build.SourceBranch)')

          if '$(Build.Reason)' == 'Manual' and len(prMatch):
            repoUri = '$(Build.Repository.Uri)'
            prNumber = prMatch[0]

          print(f"repoUri: {repoUri} , repo: {repo}, PR#: {prNumber}")

          if not re.match(r"\d+", prNumber):
            print("Skipping the comment, since not running against PR branch")
            print(f'##vso[task.setvariable variable=responseReason;]manual run, skipping comment')
            exit()

          uri = urlparse(repoUri)

          host = uri.hostname

          message_file = r'infra/wppgen2-prod/us-west-2/prod/service-infra-for-pods/device-pod5/wppgen2/vp-device//tgversioncheck.txt'


          message = ""

          if len(message_file) > 0:
            f = open(message_file)
            message = f.read()
            f.close()
          else:
            message = """"""

          # Determine which platform and configure accordingly

          if host == "github.com":
            print('Using GitHub.com configuration')

            # Parse repository owner and name from the URI or repo name
            # repo format could be "owner/repo" or just "repo"
            if "/" in repo:
              owner_repo = repo  # Already in "owner/repo" format
            else:
              # Extract from URI if repo doesn't contain owner
              uri_path = urlparse(repoUri).path.strip('/')
              if uri_path.endswith('.git'):
                uri_path = uri_path[:-4]
              owner_repo = uri_path

            token = ''
            host = "api.github.com"  # Use GitHub.com API endpoint
            path = "/repos/%s/issues/%s/comments" % (owner_repo, prNumber)
            if not token:
              print("ERROR: GitHub.com token (ghToken) is required for github.com repositories")
              exit(1)
          else:
            print(f'Using GitHub Enterprise Server configuration for host: {host}')
            token = '$(ghePassword)'
            path = "/api/v3/repos/%s/issues/%s/comments" % (repo, prNumber)
            if not token:
              print("ERROR: GHE token (gheToken) is required for GitHub Enterprise repositories")
              exit(1)

          data = { "body": "%s" % message }

          headers = {
              'Accept': 'application/vnd.github.v3.full+json',
              'Authorization': "token %s" % token,
              'Content-type': 'application/json; charset=utf8',
              'User-Agent': 'azure-pipelines'
          }


          print("Post message on Github comment...")

          print(f'Calling https://{host}{path}')

          conn = HTTPSConnection(host)

          conn.request('POST', path, json.dumps(data), headers=headers)

          response = conn.getresponse()

          print(f'##vso[task.setvariable variable=responseStatus;]{response.status}')

          print(f'##vso[task.setvariable variable=responseReason;]{response.reason}')

          print(response.status, response.reason)

          print(response.read())

          conn.close()

          response.close()
