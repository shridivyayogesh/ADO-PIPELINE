    - task: PythonScript@0
      inputs:
        scriptSource: 'inline'
        script: >
          import json

          import re


          terragrunt_out_file = 'terragrunt.out'

          collapse_pr_message = False


          o = open(terragrunt_out_file)

          message = []


          retrieve_changes = False


          # Remove ANSI escape controls (normally used for color)

          ansi_escape = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')


          # Matches Terragrunt v0.50+ module path prefix: e.g. "[path/to/module] "

          tg_prefix = re.compile(r'^\[[\w/.\-]+\]\s')


          for line in o:

            line = line.rstrip('\n')
            line = ansi_escape.sub('', line)

            # Strip Terragrunt v0.50+ module path prefix before matching markers
            line_stripped = line.strip()
            line_stripped_no_prefix = tg_prefix.sub('', line_stripped)

            if line_stripped_no_prefix.startswith("Terraform will perform the following actions"):
              retrieve_changes = True
            elif line_stripped_no_prefix.startswith("Plan: ") or line_stripped_no_prefix.startswith("Note: "):
              retrieve_changes = False
            elif retrieve_changes:
              # Strip module prefix from content lines for clean output
              line = tg_prefix.sub('', line)
              line_stripped = line.strip()
              if re.search(r'unchanged (attribute|attributes|block|blocks|element|elements) hidden', line_stripped) is not None:
                line = "" # ignore
              if len(line) > 0:
                message.append(line)

          if len(message) > 0:
            message.insert(0, "```hcl")

            if collapse_pr_message:
              message.insert(0,"\n<details><summary>Change details</summary>\n")

            message.insert(0, "## *infra/wppgen2-prod/us-east-1/prod/service-infra-for-pods/device-pod8/wppgen2/vp-device/*: Changes found")
            message.append("```")

            if collapse_pr_message:
              message.append("\n</details>")

          else:
            message.append("## *infra/wppgen2-prod/us-east-1/prod/service-infra-for-pods/device-pod8/wppgen2/vp-device/*: No changes were found")

          p = open("tgplan.txt", "w")

          for line in message:
            p.write("%s\n" % line)
          p.close()
      displayName: Run Terragrunt change detector
    - task: UsePythonVersion@0
      condition: succeeded()
      inputs:
        versionSpec: 3
        addToPath: true
        architecture: 'x64'
    - task: PythonScript@0
      displayName: "Comment on Pull Request"
      condition: succeeded()
      inputs:
        failOnStderr: false
        pythonInterpreter: 'python'
        scriptSource: 'inline'
        script: >
          import json

          import re

          from http.client import HTTPSConnection

          from urllib.parse import urlparse


          repoUri = '$(System.PullRequest.SourceRepositoryUri)'

          repo = '$(Build.Repository.Name)'

          prNumber = '$(System.PullRequest.PullRequestNumber)'


          prMatch = re.findall(r'refs/pull/(\d+)/merge', '$(Build.SourceBranch)')

          if '$(Build.Reason)' == 'Manual' and len(prMatch):
            repoUri = '$(Build.Repository.Uri)'
            prNumber = prMatch[0]

          print(f"repoUri: {repoUri} , repo: {repo}, PR#: {prNumber}")

          if not re.match(r"\d+", prNumber):
            print("Skipping the comment, since not running against PR branch")
            print(f'##vso[task.setvariable variable=responseReason;]manual run, skipping comment')
            exit()

          uri = urlparse(repoUri)

          host = uri.hostname

          message_file = r'tgplan.txt'


          message = ""

          if len(message_file) > 0:
            f = open(message_file)
            message = f.read()
            f.close()
          else:
            message = """"""

          # Determine which platform and configure accordingly

          if host == "github.com":
            print('Using GitHub.com configuration')

            # Parse repository owner and name from the URI or repo name
            # repo format could be "owner/repo" or just "repo"
            if "/" in repo:
              owner_repo = repo  # Already in "owner/repo" format
            else:
              # Extract from URI if repo doesn't contain owner
              uri_path = urlparse(repoUri).path.strip('/')
              if uri_path.endswith('.git'):
                uri_path = uri_path[:-4]
              owner_repo = uri_path

            token = ''
            host = "api.github.com"  # Use GitHub.com API endpoint
            path = "/repos/%s/issues/%s/comments" % (owner_repo, prNumber)
            if not token:
              print("ERROR: GitHub.com token (ghToken) is required for github.com repositories")
              exit(1)
          else:
            print(f'Using GitHub Enterprise Server configuration for host: {host}')
            token = '$(ghePassword)'
            path = "/api/v3/repos/%s/issues/%s/comments" % (repo, prNumber)
            if not token:
              print("ERROR: GHE token (gheToken) is required for GitHub Enterprise repositories")
              exit(1)

          data = { "body": "%s" % message }

          headers = {
              'Accept': 'application/vnd.github.v3.full+json',
              'Authorization': "token %s" % token,
              'Content-type': 'application/json; charset=utf8',
              'User-Agent': 'azure-pipelines'
          }


          print("Post message on Github comment...")

          print(f'Calling https://{host}{path}')

          conn = HTTPSConnection(host)

          conn.request('POST', path, json.dumps(data), headers=headers)

          response = conn.getresponse()

          print(f'##vso[task.setvariable variable=responseStatus;]{response.status}')

          print(f'##vso[task.setvariable variable=responseReason;]{response.reason}')

          print(response.status, response.reason)

          print(response.read())

          conn.close()

          response.close()
    - task: CmdLine@2
      displayName: 'Reset AWS assume role env vars'
      inputs:
        script: |
          echo "##vso[task.setvariable variable=AWS_ACCESS_KEY_ID]"
          echo "##vso[task.setvariable variable=AWS_SECRET_ACCESS_KEY]"
          echo "##vso[task.setvariable variable=AWS_SESSION_TOKEN]"
- stage: prod_device_pod9
  displayName: prod_device_pod9 - Terragrunt Live Infrastructure
  dependsOn:
  - PreSplunkReporting
  variables:
  - name: pool
    value: 'codeway-aws-linux2023'
  - name: ephemeralAgent
    value: true
  - group: tf-pipeline-wppgen2-prod
  - name: externalId
    value: $[variables['external_id']]
  - name: roleArn
    value: $[variables['role_arn']]
  pool:
    name: codeway-aws-linux2023
  jobs:
  - job: filter
    displayName: Stage Filter
    pool:
      name: codeway-aws-linux2023-tiny
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: true
        fetchDepth: 0
    - task: CmdLine@2
      name: GetChangedFilesFilterStages
      displayName: GetChangedFiles FilterStages
      inputs:
        script: >
          if [ -n "$CHANGED_FILES" ]; then
            echo "Changed files set."
          else
            echo "No changedFiles set. Use latest commit."
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -m --diff-filter=ACRM -r 164fc48798ee3c3b43ac7ebf071bf27d9320899e | tr '\n' '|')
          fi

          echo "Changed files: $CHANGED_FILES"

          echo "##vso[task.setvariable variable=changedFiles;isOutput=true]$CHANGED_FILES"
    - task: CmdLine@2
      name: Filter
      inputs:
        script: >
          echo "Filter: True"


          if [ -n "" ]; then
            echo "DestroyDirs declared. Dirs: "
            echo "##vso[task.setvariable variable=runStage;isOutput=true]true"
          elif [ "True" = "True" ]; then
            echo "Identifying code changes for stage filtering..."
            root_dir=$(Build.Repository.LocalPath)
            root_boundary=$(readlink -f "$root_dir"/..)
            path="$root_dir/infra/wppgen2-prod/us-west-2/prod/service-infra-for-pods/device-pod9/wppgen2/vp-device/"
            acceptable_changes="/tmp/$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 24 | head -n 1).txt"

            echo "##vso[task.setvariable variable=runStage;isOutput=true]false"

            find "$path" -type f >> $acceptable_changes
            while [[ $path != "$root_boundary" ]];
            do
              find "$path" -maxdepth 1 -mindepth 1 -name "*.hcl" >> $acceptable_changes
              path="$(readlink -f "$path"/..)"
            done
            for additional_path in ; do
              additional_full_path="$root_dir/$additional_path"
              find "$additional_full_path" -type f >> $acceptable_changes
            done
            CHANGED_FILES="$(GetChangedFilesFilterStages.changedFiles)"
            echo "Changed files: $CHANGED_FILES"
            IFS='|' read -ra FILES <<< "$CHANGED_FILES"
            for line in "${FILES[@]}";
            do
              if grep -q "$root_dir/$line" "$acceptable_changes"; then
                echo "Identified change in $root_dir/$line"
                echo "##vso[task.setvariable variable=runStage;isOutput=true]true"
              fi
            done
          else
            echo "Skip stage filtering..."
            echo "##vso[task.setvariable variable=runStage;isOutput=true]true"
          fi
  - job: prod_device_pod9
    displayName: 'Terragrunt Deployment - Path: infra/wppgen2-prod/us-west-2/prod/service-infra-for-pods/device-pod9/wppgen2/vp-device/'
    dependsOn:
    - filter
    timeoutInMinutes: 60
    condition: eq(dependencies.filter.outputs['Filter.runStage'], 'true')
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
    - task: UsePythonVersion@0
      condition: succeeded()
      inputs:
        versionSpec: 3
        addToPath: true
        architecture: 'x64'
    - task: Bash@3
      displayName: Install terragrunt
      inputs:
        targetType: inline
        script: >
          URL=https://github.com/gruntwork-io/terragrunt/releases/download/v0.32.3/terragrunt_linux_amd64

          DIR=$(Agent.ToolsDirectory)/terragrunt/v0.32.3

          FILE=$DIR/terragrunt


          if [ ! -f "$FILE" ]; then
            mkdir -p $DIR
            echo "Downloading terragrunt version v0.32.3..."
            if [ $(curl -Lf -w '%{http_code}' "$URL" -o "$FILE") -ne 200 ]; then
              echo "##vso[task.logissue type=error;]Error downloading terragrunt version v0.32.3"
              echo "##vso[task.complete result=Failed;]"
